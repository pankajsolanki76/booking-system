services:
  - type: web
    name: booking-system-api
    runtime: node
    plan: free
    buildCommand: rm -rf node_modules dist && pnpm install && pnpm prisma generate && pnpm run build
    startCommand: npx prisma migrate deploy && pnpm run start:prod
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: booking-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d

databases:
  - name: booking-db
    plan: free
    region: ohio
